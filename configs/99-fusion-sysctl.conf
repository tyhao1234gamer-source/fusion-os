# /etc/sysctl.d/99-fusion.conf -- boot-time defaults (BALANCED baseline).
# The Fusion Performance Engine overrides these at runtime per profile; these
# are the safe resting values so a fresh boot is already reasonable.
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 20
vm.dirty_background_ratio = 10
vm.max_map_count = 2147483642
kernel.sched_migration_cost_ns = 500000
# Let games (via Proton/Wine) create the many memory maps modern titles need.
fs.file-max = 524288
