# /etc/systemd/zram-generator.conf
# zram compressed swap is a real win on the PS4: 8 GB GDDR5 is shared with the
# GPU (a VRAM slice is carved out at boot), so usable RAM is tight. zstd gives
# a good ratio at low CPU cost for the Jaguar.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
