# Fusion kernel command-line additions -- appended to the boot entry by
# fusion-perf-baseline.sh (it detects systemd-boot or GRUB).
#
# These remove default kernel behaviours that cost performance and add ones
# that raise it. One line = one honest trade-off.

# --- Watchdogs: pure overhead on a gaming box, removed ---
nowatchdog
nmi_watchdog=0

# (tsc=reliable was removed: on some older laptops the TSC is unstable and
# forcing it causes clock jumps/hangs -- not acceptable on a universal OS.)

# --- Split-lock detection: can stall games that do unaligned locks ---
split_lock_detect=off

# --- NVMe: never let the SSD drop into deep power states (latency) ---
nvme_core.default_ps_max_latency_us=0

# --- Quiet boot: less console IO, faster boot ---
quiet loglevel=3

# --- CPU security mitigations ---------------------------------------------
# mitigations=off gives a REAL, often large, CPU performance gain on older /
# weak CPUs (Spectre/Meltdown/etc. workarounds are expensive). The trade-off:
# it LOWERS protection against those side-channel attacks. On a single-user,
# offline-ish gaming machine that is usually an acceptable trade; on a machine
# with sensitive data or many users it is NOT. Fusion enables it by default for
# performance but makes it a one-line opt-out:
#   remove "mitigations=off" below and re-run fusion-perf-baseline.sh --revert-mit
mitigations=off

# --- PCIe ASPM: favour performance over power (slightly higher battery use) --
pcie_aspm=performance
