# /etc/systemd/journald.conf.d/fusion.conf
# Keep the journal in RAM instead of writing it to disk constantly: less disk
# IO and stutter while gaming, and less SSD wear. Logs don't survive reboot --
# fine for a gaming box (raise to "auto" if you need persistent logs to debug).
[Journal]
Storage=volatile
RuntimeMaxUse=64M
SystemMaxUse=0
