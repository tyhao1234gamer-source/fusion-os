# /etc/sysctl.d/99-fusion-performance.conf
# Performance-raising kernel settings that override slower Linux defaults.
# Applied at boot; the Performance Engine layers per-profile values on top.

# --- Scheduler ---
kernel.sched_autogroup_enabled = 1
kernel.sched_cfs_bandwidth_slice_us = 3000
# Keep timers on their own CPU instead of migrating (less jitter).
kernel.timer_migration = 0

# --- Memory: favour keeping game pages resident, less reclaim churn ---
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 20
vm.dirty_background_ratio = 10
vm.max_map_count = 2147483642
vm.compaction_proactiveness = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# --- Let MangoHud/GameMode read perf counters without root ---
kernel.perf_event_paranoid = 1
kernel.split_lock_mitigate = 0

# --- Watchdog off (paired with the nowatchdog cmdline) ---
kernel.nmi_watchdog = 0

# --- Network: bigger buffers + fast open + BBR for smoother online play ---
net.core.rmem_max = 2500000
net.core.wmem_max = 2500000
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_fastopen = 3
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

# --- More file descriptors for modern engines / Proton ---
fs.file-max = 524288
fs.inotify.max_user_watches = 524288
