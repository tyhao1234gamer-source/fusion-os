set default="0"
set timeout="3"

# The kernel lives on the EFI System Partition next to GRUB.
# UUID_TMP is replaced by post-image.sh with the real root partition UUID, so
# the system boots whether the disk shows up as sda, sdb, nvme0n1 or a USB.
#
# Performance options (same set as the Arch edition's fusion-cmdline.conf,
# minus tsc=reliable: on some older laptops the TSC is unstable and forcing
# it causes clock problems -- not worth it on a universal image).
#   mitigations=off  faster on older CPUs, LOWER side-channel protection;
#                    the "safe" entry below keeps the mitigations on.

menuentry "Fusion OS" {
    linux /bzImage root=PARTUUID=UUID_TMP rootwait console=ttyS0,115200 console=tty1 quiet loglevel=3 nowatchdog nmi_watchdog=0 split_lock_detect=off nvme_core.default_ps_max_latency_us=0 pcie_aspm=performance mitigations=off
}

menuentry "Fusion OS (safe: CPU mitigations on)" {
    linux /bzImage root=PARTUUID=UUID_TMP rootwait console=ttyS0,115200 console=tty1 quiet loglevel=3
}

menuentry "Fusion OS (recovery shell)" {
    linux /bzImage root=PARTUUID=UUID_TMP rootwait console=ttyS0,115200 console=tty1 systemd.unit=rescue.target
}
