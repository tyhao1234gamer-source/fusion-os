# genimage config: a GPT disk image with an EFI System Partition (FAT) holding
# GRUB, and an ext4 root partition. Produces fusion-os.img, writable to a USB.

image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 32M
}

image fusion-os.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		partition-type-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
		bootable = "true"
		image = "efi-part.vfat"
	}

	partition root {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		image = "rootfs.ext4"
	}
}
