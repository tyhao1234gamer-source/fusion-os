# GPT disk image: an EFI System Partition (FAT) holding GRUB + the kernel, and
# an ext4 root partition. UUID_TMP is substituted by post-image.sh.
# Modelled on Buildroot's reference board/pc/genimage-efi.cfg.

image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}

		file bzImage {
			image = "bzImage"
		}
	}

	size = 64M
}

image fusion-os.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}

	partition root {
		# x86-64 root partition type
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = UUID_TMP
		image = "rootfs.ext2"
	}
}
