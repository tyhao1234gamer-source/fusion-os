# Hybrid GPT disk image that boots on BOTH legacy BIOS and UEFI (64- and
# 32-bit), from any disk type. UUID_TMP is substituted by post-image.sh.
#
#   LBA 0          protective MBR + GRUB boot.img (BIOS stage 1, patched by
#                  post-image.sh like grub-bios-setup does)
#   gpt1  ESP      FAT: EFI/BOOT/bootx64.efi, bootia32.efi, grub.cfg,
#                  boot/grub/grub.cfg (BIOS menu), bzImage
#   gpt2  BIOS boot  GRUB core.img (BIOS stage 2), not a filesystem
#   gpt3  root     ext4, found by PARTUUID; grown to the disk on first boot
#
# The ESP must stay gpt1: the BIOS core.img prefix is "(,gpt1)/boot/grub"
# on the drive the BIOS booted from.

image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}

		file boot {
			image = "efi-part/boot"
		}

		file bzImage {
			image = "bzImage"
		}
	}

	size = 64M
}

image fusion-os.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	partition bios {
		# "BIOS boot partition" (Hah!IdontNeedEFI)
		partition-type-uuid = 21686148-6449-6e61-6f74-656e65656646
		image = "grub.img"
		size = 1M
	}

	partition root {
		# Discoverable Partitions Spec: "Root Partition (x86-64)". (The old value
		# 44479540-... is the 32-bit x86 root type: systemd-repart would not
		# have recognised it as this machine's root and grown it.)
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = UUID_TMP
		image = "rootfs.ext2"
	}
}
