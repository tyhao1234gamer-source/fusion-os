name: Build Fusion OS from source (Buildroot)

# Compiles Fusion OS entirely from upstream source with Buildroot: the
# cross-toolchain, glibc, the Linux kernel (our config), systemd and the whole
# userland are built from source on GitHub's runners. Produces a USB-bootable
# UEFI disk image (fusion-os.img). Not a repackaged distro.
#
# Editions (layers are concatenated; last assignment wins):
#   base   = fusion_x86_64_defconfig
#   gaming = base + gaming.fragment   (Mesa/Vulkan/Wayland/audio)
#   full   = gaming + full.fragment   (Wi-Fi/NetworkManager, Flatpak, Steam session)
#
# Sources and ccache are cached between runs, so only the first build of an
# edition pays the full compile time.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "base | gaming | full"
        type: choice
        options: [base, gaming, full]
        default: base
  push:
    tags:
      - "src-v*"

env:
  EDITION: ${{ inputs.edition || 'base' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Free disk space on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Checkout Fusion repo
        uses: actions/checkout@v4
        with:
          path: fusion

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make file wget cpio unzip rsync bc \
            bzip2 perl git python3 libncurses-dev mtools dosfstools \
            parted util-linux

      - name: Generate the Fusion tools + performance layer (overlay-generated)
        run: |
          chmod +x fusion/scripts/*.sh fusion/os-source/br-external/board/fusion/*.sh \
                   fusion/os-source/br-external/board/fusion/*/usr/bin/* \
                   fusion/os-source/br-external/board/fusion/*/usr/sbin/* || true
          GEN=fusion/os-source/br-external/board/fusion/overlay-generated
          rm -rf "$GEN" && mkdir -p "$GEN"
          fusion/scripts/install-fusion-userspace.sh "$GEN"
          # The "remove slow defaults / add fast ones" layer: sysctl, journal
          # in RAM, USB autosuspend off, boot-slowing services masked. (The
          # kernel cmdline part lives in board/fusion/grub.cfg.)
          fusion/scripts/fusion-perf-baseline.sh "$GEN"
          echo "=== generated overlay ===" && find "$GEN" -maxdepth 4 | sort | head -60

      - name: Clone Buildroot (2025.02 LTS)
        run: git clone --depth 1 --branch 2025.02.x https://github.com/buildroot/buildroot.git

      - name: Compose the edition's defconfig
        run: |
          C="$GITHUB_WORKSPACE/fusion/os-source/br-external/configs"
          case "$EDITION" in
            base)   cat "$C/fusion_x86_64_defconfig" ;;
            gaming) cat "$C/fusion_x86_64_defconfig" "$C/gaming.fragment" ;;
            full)   cat "$C/fusion_x86_64_defconfig" "$C/gaming.fragment" "$C/full.fragment" ;;
            *) echo "unknown edition $EDITION"; exit 1 ;;
          esac > "$C/fusion_ci_defconfig"
          # CI-only: compiler cache + shared download dir (both cached below).
          {
            echo 'BR2_CCACHE=y'
            echo "BR2_CCACHE_DIR=\"$GITHUB_WORKSPACE/ccache\""
            echo "BR2_DL_DIR=\"$GITHUB_WORKSPACE/dl\""
          } >> "$C/fusion_ci_defconfig"
          echo "edition=$EDITION ($(grep -c '^BR2_' "$C/fusion_ci_defconfig") options)"

      # Restore/save are split so the caches are kept even when the build
      # fails -- that is exactly when the next iteration needs them.
      - name: Restore source downloads cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: br-dl-${{ env.EDITION }}-${{ github.run_id }}
          restore-keys: |
            br-dl-${{ env.EDITION }}-
            br-dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: br-ccache-${{ env.EDITION }}-${{ github.run_id }}
          restore-keys: |
            br-ccache-${{ env.EDITION }}-
            br-ccache-

      - name: Configure Buildroot with the Fusion external tree
        run: |
          make -C buildroot \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/fusion/os-source/br-external" \
            O="$GITHUB_WORKSPACE/output" fusion_ci_defconfig

      - name: Validate that Buildroot kept every requested option
        run: |
          EXT="$GITHUB_WORKSPACE/fusion/os-source/br-external"
          python3 fusion/os-source/validate-config.py \
            "$EXT/configs/fusion_ci_defconfig" "$GITHUB_WORKSPACE/output/.config" "$EXT"

      - name: Download all sources first (fail fast on a bad URL or hash)
        shell: bash
        run: |
          set -o pipefail
          make -C buildroot O="$GITHUB_WORKSPACE/output" source 2>&1 | tail -n 200

      - name: Build from source
        shell: bash
        run: |
          # pipefail: a failing make must fail this step (tail alone hides it).
          set -o pipefail
          make -C buildroot O="$GITHUB_WORKSPACE/output" 2>&1 | tail -n 4000

      - name: Collect image + checksum
        run: |
          cd "$GITHUB_WORKSPACE/output/images"
          ls -lh
          sha256sum fusion-os.img > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload Fusion OS image
        uses: actions/upload-artifact@v4
        with:
          name: fusion-os-from-source-${{ env.EDITION }}
          path: |
            output/images/fusion-os.img
            output/images/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Kernel config check (did the kernel keep our driver options?)
        id: kcheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          K=$(ls -d output/build/linux-[0-9]* | head -1)
          F=fusion/os-source/br-external/board/fusion
          frags="$F/linux-fragment.config"
          [ "$EDITION" = base ] || frags="$frags $F/linux-gaming.config"
          [ "$EDITION" = full ] && frags="$frags $F/linux-full.config"
          mkdir -p reports && cp "$K/.config" reports/kernel.config
          python3 fusion/os-source/validate-kernel-config.py "$K/.config" $frags | tee reports/kernel-config-check.txt

      - name: Install QEMU + firmware (SeaBIOS, OVMF 64-bit and 32-bit)
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools
          sudo apt-get install -y --no-install-recommends ovmf-ia32 || echo "ovmf-ia32 not available"
          ls /usr/share/OVMF/ || true
          mkdir -p reports
          chmod +x fusion/os-source/ci/boot-test.sh

      - name: Boot test - UEFI 64-bit (SATA)
        timeout-minutes: 25
        run: |
          cp output/images/fusion-os.img t-uefi.img
          fusion/os-source/ci/boot-test.sh uefi t-uefi.img FUSION_BOOT_OK reports/serial-uefi.log
          grep -q "firmware: UEFI 64-bit" reports/serial-uefi.log

      - name: Boot test - legacy BIOS (SATA)
        timeout-minutes: 25
        run: |
          cp output/images/fusion-os.img t-bios.img
          fusion/os-source/ci/boot-test.sh bios t-bios.img FUSION_BOOT_OK reports/serial-bios.log
          grep -q "firmware: BIOS" reports/serial-bios.log

      - name: Boot test - UEFI 32-bit firmware, 64-bit CPU
        id: uefi32
        timeout-minutes: 25
        continue-on-error: true
        run: |
          cp output/images/fusion-os.img t-uefi32.img
          fusion/os-source/ci/boot-test.sh uefi32 t-uefi32.img FUSION_BOOT_OK reports/serial-uefi32.log
          grep -q "firmware: UEFI 32-bit" reports/serial-uefi32.log

      - name: Install test - install from the image onto a blank disk, then boot it
        timeout-minutes: 50
        run: |
          # 1) the image, with the installer self-test switched on in both menus
          cp output/images/fusion-os.img t-src.img
          for cfg in ::/EFI/BOOT/grub.cfg ::/boot/grub/grub.cfg; do
            mcopy -n -i t-src.img@@1048576 "$cfg" g.cfg
            sed -i 's/ rootwait/ rootwait fusion.selftest=install:sdb/' g.cfg
            mcopy -o -i t-src.img@@1048576 g.cfg "$cfg"
          done
          truncate -s 8G t-target.img
          fusion/os-source/ci/boot-test.sh uefi t-src.img FUSION_INSTALL_OK reports/serial-install.log t-target.img
          # 2) the freshly installed disk ALONE, on legacy BIOS
          fusion/os-source/ci/boot-test.sh bios t-target.img FUSION_BOOT_OK reports/serial-installed-bios.log
          src_uuid=$(grep -m1 '^root:' reports/serial-install.log | awk '{print $3}')
          new_uuid=$(grep -m1 '^root:' reports/serial-installed-bios.log | awk '{print $3}')
          echo "source root PARTUUID=$src_uuid installed root PARTUUID=$new_uuid"
          [ -n "$new_uuid" ] && [ "$src_uuid" != "$new_uuid" ]

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Fusion OS ($EDITION) test results"
            echo "- kernel config check: ${{ steps.kcheck.outcome }}"
            echo "- UEFI 32-bit boot: ${{ steps.uefi32.outcome }}"
            echo '```'; cat reports/kernel-config-check.txt 2>/dev/null | head -60; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports (serial logs, kernel .config)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-${{ env.EDITION }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save source downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: br-dl-${{ env.EDITION }}-${{ github.run_id }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: br-ccache-${{ env.EDITION }}-${{ github.run_id }}

      - name: On failure, show which package broke
        if: failure()
        run: |
          df -h / | tail -1
          echo "Most recently touched build dirs:"
          ls -1t "$GITHUB_WORKSPACE/output/build" 2>/dev/null | head -5
